<nav class="sidebar" [class.aberto]="aberto" aria-label="Menu principal">
  <a class="logo" routerLink="/home">
    <app-icone nome="escudo" [tamanho]="36"></app-icone>
    <span>
      <strong>Detecção de Fraudes</strong>
      <small>Sistema de análise de riscos e acessos suspeitos</small>
    </span>
  </a>

  <ul class="itens">
    <li *ngFor="let item of itensPrincipais">
      <a [routerLink]="item.rota" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        <app-icone [nome]="item.icone"></app-icone>{{ item.rotulo }}
      </a>
    </li>

    <li>
      <div class="grupo" [class.pai-ativo]="emOcorrencias">
        <a routerLink="/ocorrencias" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
          <app-icone nome="ocorrencias"></app-icone>Ocorrências
        </a>
        <button
          type="button"
          class="alternar"
          (click)="ocorrenciasAbertas = !ocorrenciasAbertas"
          [attr.aria-expanded]="ocorrenciasAbertas"
          aria-controls="submenu-ocorrencias"
          [attr.aria-label]="ocorrenciasAbertas ? 'Recolher categorias de ocorrências' : 'Expandir categorias de ocorrências'"
        >
          <app-icone nome="seta" [tamanho]="16" [class.recolhida]="!ocorrenciasAbertas"></app-icone>
        </button>
      </div>
      <ul class="submenu" id="submenu-ocorrencias" *ngIf="ocorrenciasAbertas">
        <li *ngFor="let categoria of categoriasOcorrencias">
          <a [routerLink]="categoria.rota" routerLinkActive="ativo" ariaCurrentWhenActive="page">
            <app-icone [nome]="categoria.icone" [tamanho]="17"></app-icone>{{ categoria.rotulo }}
          </a>
        </li>
      </ul>
    </li>

    <li *ngFor="let item of itensFinaisVisiveis">
      <a [routerLink]="item.rota" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        <app-icone [nome]="item.icone"></app-icone>{{ item.rotulo }}
      </a>
    </li>
  </ul>

  <button type="button" class="sair" (click)="sair.emit()">
    <app-icone nome="sair"></app-icone>Sair
  </button>
</nav>

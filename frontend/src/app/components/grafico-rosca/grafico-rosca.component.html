<div class="grafico">
  <svg viewBox="0 0 120 120" class="rosca" role="img" [attr.aria-label]="resumoAcessivel">
    <circle cx="60" cy="60" r="46" class="trilha" />
    <g transform="rotate(-90 60 60)">
      @for (arco of arcos; track arco.rotulo) {
        @if (arco.valor > 0) {
          <circle
            cx="60"
            cy="60"
            r="46"
            class="fatia"
            [attr.stroke]="arco.cor"
            [attr.stroke-dasharray]="arco.traco"
            [attr.stroke-dashoffset]="arco.deslocamento"
            [class.apagada]="destacada && destacada !== arco.rotulo"
            (mouseenter)="destacada = arco.rotulo"
            (mouseleave)="destacada = null"
          >
            <title>{{ arco.rotulo }}: {{ arco.valor | number }} ({{ arco.percentual | number: '1.0-0' }}%)</title>
          </circle>
        }
      }
    </g>
    <text x="60" y="58" text-anchor="middle" class="centro-valor">{{ centro.valor | number }}</text>
    <text x="60" y="74" text-anchor="middle" class="centro-rotulo">{{ centro.rotulo }}</text>
  </svg>

  <ul class="legenda">
    @for (f of fatias; track f.rotulo) {
      <li
        tabindex="0"
        [class.apagada]="destacada && destacada !== f.rotulo"
        (mouseenter)="destacada = f.rotulo"
        (mouseleave)="destacada = null"
        (focus)="destacada = f.rotulo"
        (blur)="destacada = null"
      >
        <span class="marcador" [style.background]="f.cor" aria-hidden="true"></span>
        <span class="nome">{{ f.rotulo }}</span>
        <span class="valor">{{ f.valor | number }} <small>({{ percentual(f.valor) }}%)</small></span>
      </li>
    }
  </ul>
</div>
